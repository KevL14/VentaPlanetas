<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Planetas del Sistema Solar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0c2a; color: white; padding: 20px; }
        h1 { color: #00d8ff; }
        .planet {
          background-color: #1d1f45;
          padding: 15px;
          margin-bottom: 15px;
          border-radius: 12px;
          box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        .planet h2 { color: #ffdd57; margin-top: 0; }
        .planet p { margin: 5px 0; }
    </style>
</head>
<body>

<h1>Planetas del Sistema Solar</h1>
<div id="planet-list">Cargando información...</div>

<script>
    const container = document.getElementById('planet-list');
    fetch('/api/planets')  // O usa URL completa si abres archivo local
      .then(response => response.json())
      .then(planets => {
        container.innerHTML = '';
        console.log(planets);
        planets.forEach(planet => {
          const mass = planet.mass?.massValue && planet.mass?.massExponent
            ? `${planet.mass.massValue} × 10^${planet.mass.massExponent} kg`
            : 'No disponible';

          const volume = planet.vol?.volValue && planet.vol?.volExponent
            ? `${planet.vol.volValue} × 10^${planet.vol.volExponent} km³`
            : 'No disponible';

          const atmosphere = planet.atmosphere?.components?.length
            ? planet.atmosphere.components.map(comp => `${comp.name} (${comp.percent}%)`).join(', ')
            : 'No disponible';

          const div = document.createElement('div');
          div.className = 'planet';
          div.innerHTML = `
            <h2>${planet.englishName}</h2>
            <p><strong>Masa:</strong> ${mass}</p>
            <p><strong>Volumen:</strong> ${volume}</p>
            <p><strong>Gravedad:</strong> ${planet.gravity || 'No disponible'} m/s²</p>
            <p><strong>Distancia media al Sol:</strong> ${planet.semimajorAxis?.toLocaleString() || 'No disponible'} km</p>
            <p><strong>Composición atmosférica:</strong> ${atmosphere}</p>
            <p><strong>Periodo orbital:</strong> ${planet.sideralOrbit || 'No disponible'} días</p>
            <p><strong>Periodo de rotación:</strong> ${planet.sideralRotation || 'No disponible'} horas</p>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => {
        console.error('Error al cargar datos:', error);
        container.innerHTML = 'No se pudo obtener la información de los planetas.';
      });
</script>


</body>
</html>
